services:
  weatherapp:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.weatherapp
    ports:
      - '${WEATHERAPP_SERVER_ADDR_BIND:-127.0.0.1:8000}:8000'
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    volumes:
      - weatherapp_postgres_data:/var/lib/postgresql/data/
    env_file:
      - ../.env
    healthcheck:
      test: nc -z $$DB_HOST $$DB_PORT || exit 1
      interval: 5s
      timeout: 10s
      retries: 3
volumes:
  weatherapp_postgres_data:
  weatherapp_static_content:
