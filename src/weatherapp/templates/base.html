{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Weather in my locations{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{% static 'weatherapp-custom.css' %}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body class="wthr-main-bg-color">{% block body %}{% endblock %}
<footer class="footer d-flex flex-column gap-2 align-items-center py-3 my-4 border-top">
    <div class="fs-4">by Gevorji</div>
    <div class="d-flex flex-row gap-2">
        <a href="https://t.me/Gevorji">
            <img class="d-inline-block" src="{% static 'telegram_icon.png' %}" width="30px" height="30px">
        </a>
        <a href="https://github.com/Gevorji/weather-app/">
            <img class="d-inline-block" src="{% static 'github_icon.png' %}" width="30px" height="30px">
        </a>
    </div>
</footer>
</body>
</html>
